name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * 1"  # Mondays 09:17 UTC: re-pull insurer data
    - cron: "40 6 * * *"  # daily: rebuild with the latest patient reports
  workflow_dispatch:
    inputs:
      refresh:
        description: "Re-pull insurer data before building"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: pages
        uses: actions/configure-pages@v5

      - name: Refresh provider data
        if: github.event.schedule == '17 9 * * 1' || inputs.refresh
        run: sh pipeline/fetch_all.sh ${{ vars.MAX_LOCATIONS || 1500 }}

      - name: Commit refreshed data
        if: github.event.schedule == '17 9 * * 1' || inputs.refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Refresh provider data [skip ci]"
          git push

      - name: Fetch patient reports
        if: vars.FORMS_URL != ''
        run: curl -sfL "${{ vars.FORMS_URL }}" -o data/reports.json || echo '{}' > data/reports.json

      - name: Build site
        env:
          FORMS_URL: ${{ vars.FORMS_URL }}
        # SITE_URL repo variable overrides the GitHub Pages URL once you add a custom domain.
        run: python3 -I pipeline/build.py --site-url "${{ vars.SITE_URL || steps.pages.outputs.base_url }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  ping-search-engines:
    # After code pushes and data refreshes (not the daily report rebuilds),
    # tell IndexNow engines (Bing et al.) to recrawl.
    needs: deploy
    if: github.event_name == 'push' || github.event.schedule == '17 9 * * 1' || inputs.refresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I pipeline/indexnow.py "${{ vars.SITE_URL || 'https://nowacceptingpatients.com' }}"
